<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Gallery — Category</title>
<style>
:root{--cream:#f7f4ee;--black:#1d1c19;--grey:#6e6a63;--max:1180px}
body{font-family:"DM Sans",sans-serif;background:var(--cream);color:var(--black);margin:0}
.container{width:min(var(--max),calc(100% - 48px));margin:32px auto}
.section-heading .kicker{font-weight:700;text-transform:uppercase;color:#ae8751;font-size:.75rem}
.section-heading h2{font-family:"Playfair Display",serif;margin:8px 0 8px}
.back-link { display:inline-block; margin-top:6px; text-decoration:none; color:inherit; border:1px solid #ccc; padding:8px 10px; border-radius:6px; background:#fff }
.images-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:16px; margin-top:16px; }
.images-grid img { width:100%; height:160px; object-fit:cover; border-radius:6px; display:block; cursor:pointer; }
.no-image { color:var(--grey); font-size:1rem; padding:16px; background:#fff; border-radius:8px }
#lightbox { position:fixed; inset:0; display:none; align-items:center; justify-content:center; background:rgba(0,0,0,.85); z-index:9999; }
#lightbox img { max-width:92%; max-height:86%; border-radius:6px; display:block; }
.lb-btn { position:fixed; top:50%; transform:translateY(-50%); font-size:36px; color:#fff; background:transparent; border:0; cursor:pointer; padding:10px 14px; opacity:.9 }
#lbPrev { left:22px } #lbNext { right:22px } #lbClose { top:18px; right:18px; transform:none; font-size:28px; position:fixed }
/* video modal styles */
#videomodal { position:fixed; inset:0; display:none; align-items:center; justify-content:center; background:rgba(0,0,0,.85); z-index:10001; }
#videomodal video, #videomodal iframe { max-width:92%; max-height:86%; border-radius:6px; }
#videomodal .close-video { position:fixed; top:18px; right:18px; font-size:24px; color:#fff; background:transparent; border:0; cursor:pointer }
/* small visual spacing for category sections */
.category-section { margin-top:22px; padding-top:6px; border-top:1px solid rgba(0,0,0,0.03); }
.category-section h3 { margin:10px 0 6px; font-family:"Playfair Display",serif; font-size:1.05rem; color:var(--black); }
</style>
</head>
<body>

<section id="category-gallery">
  <div class="container">
    <div id="category-heading" class="section-heading">
      <div class="kicker">Gallery</div>
      <h2 id="category-title">Category</h2>
      <div id="category-info"><a class="back-link" href="index.html#gallery">← Back to gallery</a></div>
    </div>

    <div id="images-grid" class="images-grid" aria-live="polite"></div>
  </div>
</section>

<!-- Lightbox overlay -->
<div id="lightbox" role="dialog" aria-modal="true" aria-hidden="true">
  <button id="lbClose" class="lb-btn" aria-label="Close">✕</button>
  <button id="lbPrev" class="lb-btn" aria-label="Previous">❮</button>
  <img id="lightboxImg" src="" alt="">
  <button id="lbNext" class="lb-btn" aria-label="Next">❯</button>
</div>

<!-- Video modal -->
<div id="videomodal" role="dialog" aria-modal="true" aria-hidden="true">
  <button class="close-video" aria-label="Close video">✕</button>
</div>

<script>
/* CATEGORY PAGE - supports ?cat=all to show every photo category in one page
   Expects images named: images/<key>1.jpg, <key>2.jpg, ...
*/

(function () {
  const categories = {
    recital: { title: 'Student Recitals', count: 5, type: 'photos' },
    competition: { title: 'Competition', count: 5, type: 'photos' },
    exam: { title: 'Examinations', count: 5, type: 'photos' },
    performance: { title: 'Piano & Music', count: 5, type: 'photos' },
    students: { title: 'Students', count: 5, type: 'photos' },
    video: { title: 'Videos', count: 5, type: 'video' }
  };

  const base = 'images/';
  const videoBase = 'videos/';
  const ext = '.jpg';

  const params = new URLSearchParams(location.search);
  const catKey = (params.get('cat') || '').trim();
  const cat = categories[catKey];

  const titleEl = document.getElementById('category-title');
  const grid = document.getElementById('images-grid');

  // Shared lightbox sources (global order)
  const sources = [];

  // helper: add a thumbnail and register it for lightbox
  function addPhoto(src, alt, wrapper) {
    const thumb = document.createElement('img');
    thumb.src = src;
    thumb.alt = alt;
    thumb.loading = 'lazy';
    const idx = sources.length;
    sources.push(src);
    thumb.dataset.index = idx;
    thumb.addEventListener('click', () => openLB(Number(thumb.dataset.index)));
    wrapper.appendChild(thumb);
  }

  // RENDER ALL CATEGORIES
  if (catKey === 'all') {
    titleEl.textContent = 'All Photos';
    grid.innerHTML = '';

    let anyFoundGlobal = false;

    const keys = Object.keys(categories);
    keys.forEach(k => {
      const c = categories[k];
      if (c.type !== 'photos') return;

      const section = document.createElement('div');
      section.className = 'category-section';
      const heading = document.createElement('h3');
      heading.textContent = c.title;
      section.appendChild(heading);

      const wrapper = document.createElement('div');
      wrapper.className = 'images-grid';
      section.appendChild(wrapper);
      grid.appendChild(section);

      let foundThisCategory = false;

      for (let i = 1; i <= c.count; i++) {
        (function(src){
          const tester = new Image();
          tester.onload = () => {
            foundThisCategory = true;
            anyFoundGlobal = true;
            addPhoto(src, `${c.title} ${i}`, wrapper);
          };
          tester.onerror = () => {};
          tester.src = src;
        })(`${base}${k}${i}${ext}`);
      }

      setTimeout(() => {
        if (!foundThisCategory) {
          const msg = document.createElement('div');
          msg.className = 'no-image';
          msg.textContent = `No images for ${c.title}. Upload ${k}1${ext} to the ${base} folder.`;
          wrapper.appendChild(msg);
        }
      }, 600);
    });

    setTimeout(() => {
      if (!anyFoundGlobal && !sources.length) {
        grid.innerHTML = `<div class="no-image">No images found in any category. Upload images to the images/ folder.</div>`;
      }
    }, 800);

    initLightboxBehaviour();
    return;
  }

  // SINGLE CATEGORY (photos)
  if (cat && cat.type === 'photos') {
    titleEl.textContent = cat.title;
    grid.innerHTML = '';

    let foundAny = false;
    for (let i = 1; i <= cat.count; i++) {
      const src = `${base}${catKey}${i}${ext}`;
      (function (src, i) {
        const tester = new Image();
        tester.onload = () => {
          foundAny = true;
          addPhoto(src, `${cat.title} ${i}`, grid);
        };
        tester.onerror = () => {};
        tester.src = src;
      })(src, i);
    }

    setTimeout(() => {
      if (!foundAny) {
        grid.innerHTML = `<div class="no-image">No images found for ${cat.title}. Upload ${catKey}1${ext}, ${catKey}2${ext}, ... to the ${base} folder.</div>`;
      }
      initLightboxBehaviour();
    }, 500);

    return;
  }

  // VIDEO category
  if (cat && cat.type === 'video') {
    titleEl.textContent = cat.title;
    grid.innerHTML = '';
    let foundPoster = false;
    for (let i = 1; i <= cat.count; i++) {
      (function(i){
        const poster = `${base}${catKey}${i}${ext}`;
        const tester = new Image();
        tester.onload = () => {
          foundPoster = true;
          const thumb = document.createElement('img');
          thumb.src = poster;
          thumb.alt = `${cat.title} ${i}`;
          thumb.style.cursor = 'pointer';
          thumb.addEventListener('click', () => {
            const mp4 = `${videoBase}${catKey}${i}.mp4`;
            openVideoModal(mp4, poster);
          });
          grid.appendChild(thumb);
        };
        tester.onerror = () => {};
        tester.src = poster;
      })(i);
    }

    setTimeout(() => {
      if (!foundPoster) {
        fetch('videos.json').then(r => r.json()).then(list => {
          if (!Array.isArray(list) || !list.length) {
            grid.innerHTML = `<div class="no-image">No videos found. Upload poster images named ${catKey}1${ext} or create videos.json for external video links.</div>`;
            return;
          }
          list.forEach((v, idx) => {
            const thumb = document.createElement('img');
            thumb.src = v.poster || v.thumb || (`images/video${idx+1}${ext}`);
            thumb.alt = v.title || ('Video ' + (idx+1));
            thumb.style.cursor = 'pointer';
            thumb.addEventListener('click', () => {
              if (v.id && v.provider === 'youtube') openVideoEmbed(v.id);
              else if (v.url) openVideoEmbedUrl(v.url);
            });
            grid.appendChild(thumb);
          });
        }).catch(() => {
          grid.innerHTML = `<div class="no-image">No videos found. Upload poster images named ${catKey}1${ext} or create videos.json for external video links.</div>`;
        });
      }
    }, 500);

    return;
  }

  // NO category selected
  titleEl.textContent = 'Category';
  grid.innerHTML = `<div class="no-image">No category selected. Return to the <a href="index.html#gallery">main gallery</a>.</div>`;

  // LIGHTBOX & VIDEO
  function initLightboxBehaviour() {
    const lb = document.getElementById('lightbox');
    const lbImg = document.getElementById('lightboxImg');
    const btnClose = document.getElementById('lbClose');
    const btnPrev = document.getElementById('lbPrev');
    const btnNext = document.getElementById('lbNext');
    let currentIndex = 0;

    window.openLB = function(index) {
      if (!sources.length) return;
      currentIndex = index;
      lbImg.src = sources[currentIndex];
      lb.style.display = 'flex';
      lb.setAttribute('aria-hidden', 'false');
      document.body.style.overflow = 'hidden';
    };

    function closeLB() {
      lb.style.display = 'none';
      lb.setAttribute('aria-hidden', 'true');
      lbImg.src = '';
      document.body.style.overflow = '';
    }
    function showPrev() {
      if (!sources.length) return;
      currentIndex = (currentIndex - 1 + sources.length) % sources.length;
      lbImg.src = sources[currentIndex];
    }
    function showNext() {
      if (!sources.length) return;
      currentIndex = (currentIndex + 1) % sources.length;
      lbImg.src = sources[currentIndex];
    }

    if (btnClose) btnClose.addEventListener('click', closeLB);
    if (btnPrev) btnPrev.addEventListener('click', showPrev);
    if (btnNext) btnNext.addEventListener('click', showNext);
    lb.addEventListener('click', (e) => { if (e.target === lb) closeLB(); });
    document.addEventListener('keydown', (e) => {
      if (lb.style.display === 'flex') {
        if (e.key === 'Escape') closeLB();
        if (e.key === 'ArrowLeft') showPrev();
        if (e.key === 'ArrowRight') showNext();
      }
      const videoModal = document.getElementById('videomodal');
      if (videoModal && videoModal.style.display === 'flex') {
        if (e.key === 'Escape') closeVideoModal();
      }
    });
  }

  const videoModal = document.getElementById('videomodal');
  function openVideoModal(src, poster) {
    if (!videoModal) return;
    videoModal.innerHTML = '';
    const closeBtn = document.createElement('button');
    closeBtn.className = 'close-video';
    closeBtn.textContent = '✕';
    closeBtn.addEventListener('click', closeVideoModal);
    videoModal.appendChild(closeBtn);

    const video = document.createElement('video');
    video.controls = true;
    video.autoplay = true;
    video.src = src;
    if (poster) video.poster = poster;
    videoModal.appendChild(video);

    videoModal.style.display = 'flex';
    videoModal.setAttribute('aria-hidden','false');
    document.body.style.overflow = 'hidden';
  }
  function closeVideoModal() {
    if (!videoModal) return;
    videoModal.style.display = 'none';
    videoModal.setAttribute('aria-hidden','true');
    videoModal.innerHTML = '';
    document.body.style.overflow = '';
  }
  function openVideoEmbed(id) {
    if (!videoModal) return;
    videoModal.innerHTML = '';
    const closeBtn = document.createElement('button');
    closeBtn.className = 'close-video';
    closeBtn.textContent = '✕';
    closeBtn.addEventListener('click', closeVideoModal);
    videoModal.appendChild(closeBtn);

    const iframe = document.createElement('iframe');
    iframe.src = `https://www.youtube.com/embed/${id}?autoplay=1&rel=0`;
    iframe.frameBorder = '0';
    iframe.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture';
    videoModal.appendChild(iframe);

    videoModal.style.display = 'flex';
    videoModal.setAttribute('aria-hidden','false');
    document.body.style.overflow = 'hidden';
  }
  function openVideoEmbedUrl(url) {
    if (!videoModal) return;
    videoModal.innerHTML = '';
    const closeBtn = document.createElement('button');
    closeBtn.className = 'close-video';
    closeBtn.textContent = '✕';
    closeBtn.addEventListener('click', closeVideoModal);
    videoModal.appendChild(closeBtn);

    const iframe = document.createElement('iframe');
    iframe.src = url;
    iframe.frameBorder = '0';
    iframe.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture';
    videoModal.appendChild(iframe);

    videoModal.style.display = 'flex';
    videoModal.setAttribute('aria-hidden','false');
    document.body.style.overflow = 'hidden';
  }

})();
</script>

</body>
</html>
